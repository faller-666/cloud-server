server:
  port: 8080

spring:
  application:
    name: cloud-storage-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/cloud_storage
    username: cloud
    password: cloud
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate   # 表结构完全由 Flyway 管理，Hibernate 只做校验
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  data:
    redis:
      host: localhost
      port: 6379

# 应用自定义配置
app:
  jwt:
    # 生产环境建议改为环境变量注入，勿硬编码
    secret: ${JWT_SECRET:cloud-storage-dev-secret-key-change-me-in-prod-0123456789abcdef}
    access-ttl-minutes: 120                 # access token 2 小时
    refresh-ttl-days: 14                    # refresh token 14 天
    issuer: cloud-storage
  security:
    max-login-failures: 5                   # 连续失败锁定阈值
    lock-minutes: 15                        # 锁定时长（分钟）
    rate-limit-per-minute: 5                # 每分钟限流次数（IP）
  role:
    default-quota-bytes: 21474836480        # 默认 20GB

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.cloudstorage: DEBUG